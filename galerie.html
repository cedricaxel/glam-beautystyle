<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie | Glam Beautystyle</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main>
        <section class="gallery-hero">
            <div class="container gallery-hero-container">

                <div class="gallery-hero-content">

                    <!-- Breadcrumb -->
                    <div class="gallery-breadcrumb">
                        <a href="index.html">ACCUEIL</a>
                        <span>/</span>
                        <span>GALERIE</span>
                    </div>

                    <!-- Petit titre -->
                    <p class="gallery-eyebrow">
                        NOS RÉALISATIONS
                    </p>

                    <!-- Titre -->
                    <h1 class="gallery-title">
                        Laissez parler
                        <span>le résultat.</span>
                    </h1>

                    <!-- Description -->
                    <p class="gallery-description">
                        Découvrez quelques réalisations de notre équipe
                        <br class="d-none d-md-block">
                        et laissez-vous inspirer par notre univers.
                    </p>

                </div>

            </div>
        </section>

        <!-- ==========================================GALERIE=========================================== -->

        <section class="gallery-section">

            <div class="container-fluid gallery-container">

                <!-- FILTRES -->
                <div class="gallery-filters-wrapper col-12 col-md-6 col-lg-3">

                    <div class="gallery-filters">

                        <button class="gallery-filter active" data-filter="all">
                            TOUS
                        </button>

                        <button class="gallery-filter" data-filter="femme">
                            FEMME
                        </button>

                        <button class="gallery-filter" data-filter="homme">
                            HOMME
                        </button>

                        <button class="gallery-filter" data-filter="enfant">
                            ENFANT
                        </button>

                        <button class="gallery-filter" data-filter="visage">
                            SOINS DU VISAGE
                        </button>

                    </div>

                </div>


                <!-- ======================================
                    IMAGES
                ======================================= -->

                <div class="row g-2 gallery-grid">


                    <!-- 1 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/femme-1.jpg"
                                alt="Coiffure femme Glam Beautystyle"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 2 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="homme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/homme-1.jpg"
                                alt="Coupe homme Glam Beautystyle"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 3 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="enfant">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/enfant-1.jpg"
                                alt="Coiffure enfant Glam Beautystyle"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 4 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/femme-2.jpg"
                                alt="Chignon femme"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 5 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="homme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/homme-2.jpg"
                                alt="Dégradé homme"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 6 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/tresses-1.jpg"
                                alt="Tresses"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 7 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/femme-3.jpg"
                                alt="Coiffure ondulée femme"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 8 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="visage">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/visage-1.jpg"
                                alt="Soin du visage"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 9 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/femme-4.jpg"
                                alt="Cheveux lisses"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 10 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/femme-5.jpg"
                                alt="Coupe courte femme"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 11 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="enfant">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/enfant-2.jpg"
                                alt="Coupe enfant"
                                loading="lazy"
                            >

                        </div>

                    </div>


                    <!-- 12 -->
                    <div class="col-12 col-sm-6 col-md-4 col-xl-2 gallery-item"
                        data-category="femme">

                        <div class="gallery-image">

                            <img
                                src="assets/images/gallery/femme-6.jpg"
                                alt="Coiffure longue femme"
                                loading="lazy"
                            >

                        </div>

                    </div>

                </div>

            </div>

        </section>
    </main>
</body>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</html>
